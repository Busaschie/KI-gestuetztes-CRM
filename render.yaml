services:
  - type: web
    name: sandra-crm
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi
  - type: worker
    name: sandra-crm-worker
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements/prod.txt
    startCommand: python manage.py qcluster
