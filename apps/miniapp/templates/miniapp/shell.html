<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandra CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #C6122F);
    --btn: var(--tg-theme-button-color, #C6122F);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: color-mix(in srgb, var(--text) 12%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--text);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  nav { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; padding: 8px 12px; background: var(--bg);
        border-bottom: 1px solid var(--sep); }
  nav button { flex: 1; padding: 8px 4px; border: 0; border-radius: 10px; background: transparent; color: var(--hint);
               font: inherit; font-weight: 600; }
  nav button.active { background: var(--bg2); color: var(--text); }
  nav button:disabled { opacity: .45; }
  main { padding: 12px 12px 32px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 4px 6px; }
  .card { background: var(--bg); border-radius: 12px; overflow: hidden; }
  .item { padding: 10px 12px; border-bottom: 1px solid var(--sep); }
  .item:last-child { border-bottom: 0; }
  .item .title { font-weight: 600; }
  .item .sub { color: var(--hint); font-size: 13px; }
  .late { color: #d93025; font-weight: 600; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .actions button { border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px;
                    background: var(--bg2); color: var(--text); }
  .actions button.primary { background: var(--btn); color: var(--btn-text); }
  .empty { padding: 12px; color: var(--hint); }
  .flash { background: var(--bg); border-left: 4px solid var(--btn); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .error { color: #d93025; padding: 12px; }
  .htmx-request button { opacity: .6; }
  a.item { display: block; color: inherit; text-decoration: none; }
  .back { display: inline-block; margin: 4px 4px 0; color: var(--link); text-decoration: none; font-weight: 600; }
  select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--sep);
           background: var(--bg2); color: var(--text); }
  .badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 9px; background: var(--bg2); color: var(--hint); }
</style>
</head>
<body>
<nav>
  <button class="active" hx-get="{% url 'miniapp:today' %}" hx-target="main">Heute</button>
  <button hx-get="{% url 'miniapp:contracts' %}" hx-target="main">Verträge</button>
  <button hx-get="{% url 'miniapp:mandates' %}" hx-target="main">Aufträge</button>
</nav>
<main id="main"><p class="empty">Lade …</p></main>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  // initData bei JEDER Anfrage mitschicken – der Server prüft die Signatur (kein Cookie nötig)
  document.body.addEventListener("htmx:configRequest", (e) => {
    e.detail.headers["X-Telegram-Init-Data"] = tg ? tg.initData : "";
  });
  // Rückfragen (hx-confirm) als Telegram-Dialog statt Browser-confirm
  document.body.addEventListener("htmx:confirm", (e) => {
    if (!e.detail.question || !tg || !tg.showConfirm) return;
    e.preventDefault();
    tg.showConfirm(e.detail.question, (ok) => { if (ok) e.detail.issueRequest(true); });
  });
  document.body.addEventListener("htmx:responseError", (e) => {
    document.getElementById("main").innerHTML = e.detail.xhr.responseText || '<p class="error">Fehler beim Laden.</p>';
  });
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
  }));
  htmx.ajax("GET", "{% url 'miniapp:today' %}", {target: "#main"});
</script>
</body>
</html>
