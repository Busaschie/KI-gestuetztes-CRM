# Lokale Dienste für die Entwicklung. Start: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sandra-db
    environment:
      POSTGRES_DB: sandra_crm
      POSTGRES_USER: sandra
      POSTGRES_PASSWORD: sandra   # nur lokal – im Betrieb kommt alles aus Umgebungsvariablen
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg-data:
